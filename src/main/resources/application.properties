spring.application.name=StickyNoteSQL

# Database connection - use env vars so the app is portable across local and containerized environments.
spring.r2dbc.url=r2dbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:db_stickynote}
spring.r2dbc.username=${DB_USERNAME:stickynote_user}
spring.r2dbc.password=${DB_PASSWORD:ChangeMe123!}

spring.sql.init.mode=always

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

server.port=${SERVER_PORT:8080}

logging.level.org.springframework.security=INFO
logging.level.org.springframework.r2dbc=INFO
